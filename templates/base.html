<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Mithiin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <a href="{{ url_for('home') }}" class="brand">MITHIIN</a>
      <nav>
        {% if session.get("user_id") %}
        <a href="{{ url_for('user_logout') }}">Logout</a>
        {% else %}
        <p> Existing User? <a href="{{ url_for('user_login') }}">Login</a></p>
        <p> New user? <a href="{{ url_for('register') }}">Register Here</a></p>
        {% endif %}
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>For partner and supplier inquiries, contact <a href="mailto:info@mithiinko.com">info@mithiinko.com</a></p>
    </footer>
  </body>
</html>
