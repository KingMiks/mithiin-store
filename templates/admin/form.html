{% extends "base.html" %}
{% block title %}Save Product{% endblock %}

{% block content %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name</label>
    <input name="name" type="text" value="{{ product.name if product else '' }}">
    <label>Cut</label>
    <input name="cut" type="text" value="{{ product.cut if product else '' }}">
    <label>Carat</label>
    <input name="carat" type="number" step="0.01" value="{{ product.carat if product else '' }}">
    <label>Price</label>
    <input name="price" type="number" value="{{ product.price if product else '' }}">
    <label>Stock</label>
    <input name="stock" type="number" value="{{ product.stock if product else '' }}">
    <label>Image</label>
    <input name="image" type="text" value="{{ product.image if product else '' }}">
    <label>Status</label>
    <select name="status">
  <option value="active" {{ 'selected' if product and product.status == "active" else '' }}>Active</option>
  <option value="hidden" {{ 'selected' if product and product.status == "hidden" else '' }}>Hidden</option>
  <option value="coming_soon" {{ 'selected' if product and product.status == "coming_soon" else '' }}>Coming Soon</option>
</select>
    <button type="submit">Save</button>
</form>
{% endblock %}
