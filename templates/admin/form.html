{% extends "base.html" %}
{% block title %}Add Product{% endblock %}

{% block content %}
<form method="post">
    <label>name</label>
    <input name="name" type="text">
    <label>cut</label>
    <input name="cut" type="text">
    <label>carat</label>
    <input name="carat" type="number" step="0.01">
    <label>price</label>
    <input name="price" type="number">
    <label>stock</label>
    <input name="stock" type="number">
    <label>image</label>
    <input name="image" type="text">
    <button type="submit">Add product</button>
</form>
{% endblock %}
