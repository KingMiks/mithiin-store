{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<a href="{{ url_for('admin_add')}}">Add item</a>
{% for item in inventory %}
  <p>{{ item.name }}</p>
  <p>{{ item.cut }}</p>
  <p>{{ item.carat }}</p>
  <p>{{ item.price }}</p>
  <p>{{ item.stock }}</p>
<a href="{{ url_for('admin_edit', product_id=item.id) }}">Edit</a>
<form method="post" action="{{ url_for('admin_delete', product_id=item.id) }}" onsubmit="return confirm('Delete {{item.name}}?');">
  <button type="submit">Delete</button>
</form>
{% endfor %}
<a href="{{ url_for('admin_logout') }}">Logout</a>
{% endblock %}
