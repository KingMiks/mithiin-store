{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}
<form method="post">
    <input name="password" type="password">
    <button type="submit">Log in</button>
</form>
{% endblock %}
